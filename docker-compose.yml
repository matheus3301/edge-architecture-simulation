version: '3.3'
services:
  broker:
    image: rabbitmq:3-management-alpine
    container_name: 'broker'
    hostname: 'broker'
    ports:
      - 5672:5672
      - 15672:15672
    # volumes:
    #   - rabbitmq_data:/var/lib/rabbitmq/
    #   - rabbitmq_log:/var/log/rabbitmq/
    networks:
      - default
      
  smartwatch_node:
    depends_on:
      - broker
      - raspberry_node
    environment:
      WAIT_HOSTS: broker:5672
    build: ./wearable
    deploy:
      replicas: 1
    networks:
      - default

  raspberry_node:
    depends_on:
      - broker
    environment:
      WAIT_HOSTS: broker:5672
      LATITUDE_LO: -4
      LATITUDE_HI: -3
      LONGITUDE_LO: -38
      LONGITUDE_HI: -37
      BROKER_HOSTNAME: broker
      BROKER_PORT: 5672
      BROKER_USERNAME: guest
      BROKER_PASSWORD: guest
      BROKER_QUEUE_NAME: smartwatch_sensor_data
    build: ./edge
    deploy:
      replicas: 1
    networks:
      - default
    

# volumes:
#   rabbitmq_data:
#   rabbitmq_log:

networks:
  default:
    driver: bridge